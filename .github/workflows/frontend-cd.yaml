name: Frontend Continuous Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - run: npm ci
      - run: CI=true npm run test

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Setup Kubeconfig & Resolve Backend URL
        id: resolve-backend
        run: |
          aws eks update-kubeconfig --name cluster --region ${{ secrets.AWS_REGION }}

          # Wait up to 60s for backend LoadBalancer hostname if available
          BACKEND_HOST=""
          for i in {1..12}; do
            BACKEND_HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$BACKEND_HOST" ]; then
              echo "Found Backend Host: $BACKEND_HOST"
              break
            fi
            echo "Waiting for Backend LoadBalancer hostname... ($i/12)"
            sleep 5
          done

          # Check service port for backend
          if [ -n "$BACKEND_HOST" ]; then
            BACKEND_PORT=$(kubectl get svc backend -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || echo "5000")
            if [ "$BACKEND_PORT" = "80" ]; then
              echo "BACKEND_URL=http://$BACKEND_HOST" >> $GITHUB_ENV
            else
              echo "BACKEND_URL=http://$BACKEND_HOST:$BACKEND_PORT" >> $GITHUB_ENV
            fi
          else
            echo "BACKEND_URL=http://localhost:5000" >> $GITHUB_ENV
          fi

      - name: Build, tag, and push Frontend Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mp-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg REACT_APP_MOVIE_API_URL="${{ env.BACKEND_URL }}" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy Frontend to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd k8s
          kustomize edit set image frontend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          kustomize build | kubectl apply -f -
          kubectl rollout status deployment/frontend --timeout=180s